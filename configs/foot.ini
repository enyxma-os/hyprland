# Enyxma OS - Foot Terminal Configuration
# Deep Space Theme: #080B12 background with Sky/Cyan (#38BDF8) and Indigo (#818CF8) accents

font=JetBrainsMono Nerd Font:size=11
pad=12x12
initial-window-size-chars=110x32

[cursor]
style=beam
color=080b12 38bdf8
blink=yes

[colors]
alpha=0.92
background=080b12
foreground=f8fafc

## Normal colors
regular0=161d2e # black (surface)
regular1=ef4444 # red
regular2=10b981 # green
regular3=f59e0b # yellow
regular4=38bdf8 # blue / sky
regular5=818cf8 # magenta / indigo
regular6=06b6d4 # cyan
regular7=e2e8f0 # white

## Bright colors
bright0=334155 # bright black (slate)
bright1=f87171 # bright red
bright2=34d399 # bright green
bright3=fbbf24 # bright yellow
bright4=60a5fa # bright blue
bright5=a5b4fc # bright magenta
bright6=22d3ee # bright cyan
bright7=ffffff # bright white

[scrollback]
lines=10000

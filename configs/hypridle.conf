# =====================================================
# enyxma boşta kalma ve güç yöneticisi (hypridle)
# UWSM ve hyprlock ile tam entegre çalışır
# =====================================================

general {
    lock_cmd            = pidof hyprlock || hyprlock   # Zaten açıksa tekrar açma
    before_sleep_cmd    = loginctl lock-session        # Sistem uykuya geçmeden kilitle
    after_sleep_cmd     = hyprctl dispatch dpms on     # Uyanınca ekran sinyalini aç
    ignore_dbus_inhibit = false                        # Medya/tarayıcı inhibit isteklerine saygı duy
}

# 1. Aşama: 5 Dakika — Ekran parlaklığı hafifçe kısılır (Donanım tasarrufu)
listener {
    timeout     = 300
    on-timeout  = ~/.config/hypr/scripts/brightness.sh set 20
    on-resume   = ~/.config/hypr/scripts/brightness.sh set 100
}

# 2. Aşama: 10 Dakika — Oturum kilitlenir (hyprlock tetiklenir)
listener {
    timeout     = 600
    on-timeout  = loginctl lock-session
}

# 3. Aşama: 12 Dakika — Ekran sinyali kesilir (DPMS Off)
listener {
    timeout     = 720
    on-timeout  = hyprctl dispatch dpms off
    on-resume   = hyprctl dispatch dpms on
}

# 4. Aşama: 30 Dakika — Sistem askıya alınır (Suspend)
listener {
    timeout     = 1800
    on-timeout  = systemctl suspend
}

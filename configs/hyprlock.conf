# =====================================================
# enyxma kilit ekranı (hyprlock)
# Glassmorphism derinliği, canlı bulanık arkaplan ve Enyxma renk paleti
# =====================================================

general {
    hide_cursor         = true
    ignore_empty_input  = false
}

# ── Canlı Bulanık Arka Plan ─────────────────────────
background {
    monitor             =
    path                = screenshot  # Kilit anındaki ekranı yakalar
    color               = rgba(8, 11, 18, 1.0)

    blur_passes         = 4
    blur_size           = 7
    noise               = 0.02
    contrast            = 0.9
    brightness          = 0.7
    vibrancy            = 0.2
    vibrancy_darkness   = 0.5
}

# ── Saat ─────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] echo "<b>$(date '+%H:%M')</b>"
    color       = rgba(241, 245, 249, 1.0)
    font_size   = 88
    font_family = "JetBrains Mono Nerd Font"
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(8, 11, 18, 0.7)

    position    = 0, 160
    halign      = center
    valign      = center
}

# ── Tarih ────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"
    color       = rgba(148, 163, 184, 0.9)
    font_size   = 20
    font_family = "JetBrains Mono Nerd Font"
    shadow_passes = 1
    shadow_color  = rgba(8, 11, 18, 0.7)

    position    = 0, 65
    halign      = center
    valign      = center
}

# ── Şifre Giriş Alanı (Enyxma Glassmorphism) ─────────
input-field {
    monitor     =
    size        = 340, 56

    outline_thickness   = 2
    dots_size           = 0.28
    dots_spacing        = 0.18
    dots_center         = true
    dots_rounding       = -1

    # Enyxma Cyan -> Indigo Gradyan Kenarlık
    outer_color  = rgba(56, 189, 248, 0.8) rgba(129, 140, 248, 0.8) 45deg
    inner_color  = rgba(15, 23, 42, 0.85)
    font_color   = rgba(248, 250, 252, 1.0)
    check_color  = rgba(52, 211, 153, 1.0)
    fail_color   = rgba(248, 113, 113, 1.0)
    fade_on_empty   = true
    fade_timeout    = 1200

    placeholder_text = <span foreground="##64748b">✦ şifre...</span>
    fail_text        = <b>$PAMFAIL</b>

    rounding    = 16
    shadow_passes = 2
    shadow_size   = 12
    shadow_color  = rgba(8, 11, 18, 0.7)

    position    = 0, -35
    halign      = center
    valign      = center
}

# ── Kullanıcı Rozeti ─────────────────────────────────
label {
    monitor     =
    text        = ✦ $USER
    color       = rgba(148, 163, 184, 0.8)
    font_size   = 14
    font_family = "JetBrains Mono Nerd Font"

    position    = 0, -100
    halign      = center
    valign      = center
}

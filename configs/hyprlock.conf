# Enyxma OS — Gotham 2.0 Hyprlock Yapilandirmasi
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    color = rgba(07080bff)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.70
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(f0b429cc) rgba(f0b429cc) 45deg
    inner_color = rgba(0b0d12d9)
    font_color = rgba(e2e8f0ff)
    fade_on_empty = false
    font_family = Orbitron
    placeholder_text = <i><span foreground="##94a3b8">Parola...</span></i>
    hide_input = false
    check_color = rgba(f0b429ff)
    fail_color = rgba(e11d48ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(f0b429ff)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(e2e8f0ff)
    font_size = 84
    font_family = Orbitron
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%d %B %Y, %A")"
    color = rgba(f5c518ff)
    font_size = 18
    font_family = Orbitron
    position = 0, 35
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(94a3b8ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

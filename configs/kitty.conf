# Enyxma OS - Kitty Terminal Configuration
# Deep Space Theme: #080B12 background with Sky/Cyan (#38BDF8) and Indigo (#818CF8) accents

font_family      JetBrainsMono Nerd Font
font_size        11.0
cursor_shape     beam
cursor_blink_interval 0.5

window_padding_width 10
background_opacity 0.92
confirm_os_window_close 0
enable_audio_bell no

# Colors
background #080b12
foreground #f8fafc
cursor     #38bdf8

